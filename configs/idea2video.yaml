chat_model:
  init_args:
    model: ${CHAT_MODEL:-google/gemini-2.5-flash-lite-preview-09-2025}
    model_provider: openai
    api_key: ${OPENROUTER_API_KEY}
    base_url: ${CHAT_BASE_URL:-https://openrouter.ai/api/v1}
  max_requests_per_minute: 500
  max_requests_per_day: 2000

# IMAGE GENERATOR — pick one adapter + model
#
# Option A: OpenRouter (Recraft, GPT Image 2, Flux, etc.)
#   class_path: tools.image_generator_openai_api.ImageGeneratorOpenAIAPI
#   init_args:
#     base_url: https://openrouter.ai/api/v1
#     model: recraft-v3          # or gpt-image-2, flux-2-pro, nanobanana-pro
#
# Option B: Google direct API (Gemini image generation)
#   class_path: tools.ImageGeneratorNanobananaGoogleAPI
#   init_args: { api_key: ${GOOGLE_IMAGEN_API_KEY} }

image_generator:
  class_path: tools.image_generator_openai_api.ImageGeneratorOpenAIAPI
  init_args:
    api_key: ${IMAGE_API_KEY}
    base_url: ${IMAGE_BASE_URL:-https://openrouter.ai/api/v1}
    model: ${IMAGE_MODEL:-recraft-v3}
  max_requests_per_minute: 10
  max_requests_per_day: 500


# VIDEO GENERATOR — pick one adapter + model
#
# Option A: OpenRouter (Veo 3.1, Kling Video, etc.)
#   class_path: tools.video_generator_openrouter_api.VideoGeneratorOpenRouterAPI
#   init_args:
#     model: google/veo-3.1     # or google/veo-3.1-fast, google/veo-3.1-lite, kuaishou/kling-video-o1
#
# Option B: Google direct API (Veo)
#   class_path: tools.VideoGeneratorVeoGoogleAPI
#   init_args: { api_key: ${GOOGLE_VEO_API_KEY} }

video_generator:
  class_path: tools.video_generator_openrouter_api.VideoGeneratorOpenRouterAPI
  init_args:
    api_key: ${VIDEO_API_KEY}
    base_url: ${VIDEO_BASE_URL:-https://openrouter.ai/api/v1}
    model: ${VIDEO_MODEL:-google/veo-3.1}
  max_requests_per_minute: 2
  max_requests_per_day: 10


working_dir: .working_dir/idea2video
